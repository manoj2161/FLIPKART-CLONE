<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Flipkart.com</title>
    <link rel="shortcut icon" href="assets/images/navbar logos/img 7 favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>

<body>
    <header>
        <div class="headerbox1"></div>
        <div class="headerboxes">
            <div class="headerbox2">
                <div class="flipkartlogo">
                    <div class="logoimg"><img src="assets/images/login page/HEADER/img 1 flipkart.png" alt=""></div>
                    <div class="logotxt"><a href="#">Explore<span>Plus</span><img
                                src="assets/images/login page/HEADER/img 2 star.png" width="10px" height="10px"
                                alt=""></a></div>
                </div>
            </div>
            <div class="headerbox3">
                <div class="search">
                    <input type="text" title="Search for products, brands and more" name="" id=""
                        placeholder="Search for products, brands and more">
                </div>
                <div class="searchicon">
                    <button><img src="assets/images/login page/HEADER/img5 search.svg" width="22px" height="22px"
                            alt=""></button>
                </div>
            </div>
            <div class="headerbox4">
                <button class="loginbtn"><a href="login.html">Login</a></button>
            </div>
        </div>
    </header>
    <main>
        <section class="section2">
            <div class="section2box2">
                <div class="section2box2img"><img src="assets/images/cart page/img 1.webp" alt=""></div>
                <div class="section2box2txt1">Missing Cart items?</div>
                <div class="section2box2txt2">Login to see the items you added previously</div>
                <button class="loginbtn2"><a href="">Login</a></button>
            </div>
        </section>
        <footer>
            <section class="section3">
                <div class="footerbox1">
                    <div class="footerboxtxt1"><span>Policies: Returns Policy | Terms of use | Security |
                            Privacy</span><span class="foottxt1">© 2007-2025 Flipkart.com</span>
                    </div>
                    <div class="footerboxtxt2"><span>Need Help? Visit the <a href="">Help Center </a>or
                            <a href="">Contact Us</a></span></div>
                </div>
            </section>
        </footer>
    </main>
</body>

</html>
